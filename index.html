<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskFlow | タスク管理</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--ink:#172033;--muted:#778198;--line:#e7eaf1;--blue:#4263eb;--blue2:#edf1ff;--green:#15966a;--red:#d9485f;--shadow:0 8px 28px rgba(27,39,73,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Noto Sans JP",sans-serif}.app{max-width:1180px;margin:auto;padding:28px 22px 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.brand{display:flex;align-items:center;gap:11px;font-size:22px;font-weight:800;letter-spacing:-.5px}.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--blue);color:white;font-size:20px}.sub{color:var(--muted);font-size:13px}.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}.btn:hover{filter:brightness(.95)}.btn.secondary{background:#f0f2f7;color:#35405a}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat{padding:18px 20px}.stat-label{color:var(--muted);font-size:13px}.stat-num{font-size:29px;font-weight:800;margin-top:5px}.stat-num small{font-size:13px;color:var(--muted);font-weight:500}.layout{display:grid;grid-template-columns:220px 1fr;gap:18px}.side{padding:18px;height:max-content}.side h3{font-size:12px;color:var(--muted);margin:3px 10px 12px}.nav{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:9px;color:#566078;cursor:pointer;font:inherit}.nav.active,.nav:hover{background:var(--blue2);color:var(--blue);font-weight:700}.main{padding:22px}.mainhead{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.mainhead h1{font-size:21px;margin:0}.tools{display:flex;gap:9px;flex-wrap:wrap}.search,select,input{border:1px solid var(--line);border-radius:9px;padding:10px 12px;font:inherit;background:#fff;color:var(--ink)}.search{width:220px}.filters{display:flex;gap:8px;margin:0 0 15px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:white;border-radius:20px;padding:6px 13px;color:#667085;cursor:pointer;font-size:13px}.filter.active{background:var(--blue2);border-color:#d8e0ff;color:var(--blue);font-weight:700}.tasklist{display:grid;gap:10px}.task{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}.task.done .task-title{text-decoration:line-through;color:#9aa2b2}.check{width:19px;height:19px;accent-color:var(--blue);cursor:pointer}.taskbody{min-width:0;flex:1}.task-title{font-weight:650;overflow-wrap:anywhere}.task-meta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;margin-top:4px}.tag{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700}.high{background:#fff0f0;color:#d9485f}.medium{background:#fff6e5;color:#a96b00}.low{background:#eaf8f2;color:#16845f}.task-actions{display:flex;gap:6px}.iconbtn{border:0;background:#f3f5f9;color:#667085;border-radius:8px;padding:7px 9px;cursor:pointer}.iconbtn:hover{background:#e9edfa;color:var(--blue)}.empty{text-align:center;color:var(--muted);padding:42px 12px}.empty b{display:block;color:#35405a;font-size:16px;margin-bottom:5px}.modalback{position:fixed;inset:0;background:#17203380;display:none;align-items:center;justify-content:center;padding:18px}.modalback.show{display:flex}.modal{background:#fff;border-radius:17px;padding:24px;width:min(440px,100%);box-shadow:0 20px 70px #0003}.modal h2{margin:0 0 18px;font-size:20px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:13px;color:#566078;font-weight:650}.field input,.field select{width:100%}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#172033;color:white;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
@media(max-width:760px){.app{padding:18px 13px}.stats{gap:8px}.stat{padding:13px}.stat-num{font-size:23px}.layout{grid-template-columns:1fr}.side{display:flex;gap:4px;padding:8px}.side h3{display:none}.nav{padding:9px;text-align:center;font-size:13px}.main{padding:15px}.mainhead{align-items:flex-start;flex-direction:column}.tools{width:100%}.search{flex:1;width:100%}.task{padding:11px}.task-actions{flex-direction:column}}
</style></head>
<body><div class="app">
<header class="top"><div><div class="brand"><span class="logo">✓</span>TaskFlow</div><div class="sub">毎日の仕事を、もっとシンプルに。</div></div><button class="btn" id="addTop">＋ タスクを追加</button></header>
<section class="stats"><div class="stat"><div class="stat-label">すべてのタスク</div><div class="stat-num" id="total">0 <small>件</small></div></div><div class="stat"><div class="stat-label">未完了</div><div class="stat-num" id="remaining">0 <small>件</small></div></div><div class="stat"><div class="stat-label">完了</div><div class="stat-num" id="completed">0 <small>件</small></div></div></section>
<div class="layout"><aside class="panel side"><h3>メニュー</h3><button class="nav active" data-view="all">▤　すべて</button><button class="nav" data-view="active">◷　未完了</button><button class="nav" data-view="done">✓　完了済み</button></aside>
<main class="panel main"><div class="mainhead"><h1 id="heading">すべてのタスク</h1><div class="tools"><input class="search" id="search" placeholder="タスクを検索..."><button class="btn" id="addMain">＋ 追加</button></div></div><div class="filters"><button class="filter active" data-priority="all">すべて</button><button class="filter" data-priority="high">高</button><button class="filter" data-priority="medium">中</button><button class="filter" data-priority="low">低</button></div><div class="tasklist" id="taskList"></div></main></div>
</div>
<div class="modalback" id="modal"><form class="modal" id="taskForm"><h2 id="modalTitle">タスクを追加</h2><div class="field"><label for="title">タスク名 *</label><input id="title" maxlength="80" placeholder="例：ポートフォリオを作成する" required></div><div class="field"><label for="due">期限</label><input id="due" type="date"></div><div class="field"><label for="priority">優先順位</label><select id="priority"><option value="high">高</option><option value="medium" selected>中</option><option value="low">低</option></select></div><div class="modalfoot"><button type="button" class="btn secondary" id="cancel">キャンセル</button><button class="btn" type="submit">保存する</button></div></form></div><div class="toast" id="toast"></div>
<script>
const KEY='taskflow_tasks_v1';let tasks=JSON.parse(localStorage.getItem(KEY)||'null')||[
{id:1,title:'ポートフォリオの構成を考える',due:'',priority:'high',done:false},{id:2,title:'JavaScriptの基礎を復習する',due:'',priority:'medium',done:false},{id:3,title:'READMEを作成する',due:'',priority:'low',done:true}
];let view='all',priorityFilter='all',editing=null;
const $=id=>document.getElementById(id);const save=()=>localStorage.setItem(KEY,JSON.stringify(tasks));
function notify(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
function render(){const total=tasks.length,done=tasks.filter(t=>t.done).length;$('total').innerHTML=`${total} <small>件</small>`;$('remaining').innerHTML=`${total-done} <small>件</small>`;$('completed').innerHTML=`${done} <small>件</small>`;
$('heading').textContent=view==='all'?'すべてのタスク':view==='active'?'未完了のタスク':'完了済みのタスク';let q=$('search').value.trim().toLowerCase();let shown=tasks.filter(t=>(view==='all'||(view==='active'&&!t.done)||(view==='done'&&t.done))&&(priorityFilter==='all'||t.priority===priorityFilter)&&t.title.toLowerCase().includes(q));
$('taskList').innerHTML=shown.length?shown.map(t=>`<article class="task ${t.done?'done':''}"><input class="check" type="checkbox" ${t.done?'checked':''} aria-label="完了にする" onchange="toggleTask(${t.id})"><div class="taskbody"><div class="task-title">${escapeHtml(t.title)}</div><div class="task-meta"><span class="tag ${t.priority}">${{high:'優先度：高',medium:'優先度：中',low:'優先度：低'}[t.priority]}</span>${t.due?`<span>期限：${t.due}</span>`:'<span>期限なし</span>'}</div></div><div class="task-actions"><button class="iconbtn" onclick="editTask(${t.id})" aria-label="編集">編集</button><button class="iconbtn" onclick="deleteTask(${t.id})" aria-label="削除">削除</button></div></article>`).join(''):`<div class="empty"><b>タスクがありません</b>検索条件を変えるか、新しいタスクを追加してください。</div>`;}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function openModal(task=null){editing=task?task.id:null;$('modalTitle').textContent=task?'タスクを編集':'タスクを追加';$('title').value=task?task.title:'';$('due').value=task?task.due:'';$('priority').value=task?task.priority:'medium';$('modal').classList.add('show');$('title').focus();}
function closeModal(){$('modal').classList.remove('show');$('taskForm').reset();editing=null;}
function toggleTask(id){const t=tasks.find(x=>x.id===id);if(t){t.done=!t.done;save();render();notify(t.done?'タスクを完了にしました':'未完了に戻しました');}}
function editTask(id){const t=tasks.find(x=>x.id===id);if(t)openModal(t)}
function deleteTask(id){if(confirm('このタスクを削除しますか？')){tasks=tasks.filter(t=>t.id!==id);save();render();notify('タスクを削除しました')}}
$('taskForm').addEventListener('submit',e=>{e.preventDefault();let data={title:$('title').value.trim(),due:$('due').value,priority:$('priority').value};if(!data.title)return;if(editing){Object.assign(tasks.find(t=>t.id===editing),data);notify('タスクを更新しました')}else{tasks.unshift({id:Date.now(),...data,done:false});notify('タスクを追加しました')}save();closeModal();render()});
$('addTop').onclick=$('addMain').onclick=()=>openModal();$('cancel').onclick=closeModal;$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});$('search').addEventListener('input',render);
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x===b));render()}));document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{priorityFilter=b.dataset.priority;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()}));render();
</script></body></html>
